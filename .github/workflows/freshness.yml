name: Freshness check

# Alerts on Discord if a scheduled store has had no good crawl for FRESHNESS_MAX_HOURS (26): catches crawls that never
# started at all, which the in-crawl monitor can't see. 16:30 UTC = 12:30 Toronto in summer.
on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      ALERT_DISCORD_WEBHOOK_URL: ${{ secrets.ALERT_DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/scheduled.py check-freshness
