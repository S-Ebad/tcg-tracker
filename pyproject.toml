[project]
name = "tcg-tracker"
version = "0.1.0"
description = "Canadian Yu-Gi-Oh price tracker (Scrapy + PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
    "scrapy>=2.13",
    "psycopg[binary]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg-pool>=3.2",
]

# Dev tools; uv installs this group by default on `uv sync`
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# test cases are written one realistic title per line; wrapping them hurts readability
"tests/*" = ["E501"]
